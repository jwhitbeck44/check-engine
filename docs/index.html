<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same look as From Here to There and the class version: UCCS black, white and CU Gold (#CFB87C).
   Gold always carries black text. The dashboard is a black panel in both light and dark mode. */
:root {
  --paper: #ffffff; --card: #ffffff; --ink: #000000; --muted: #565a5c; --line: #d4d5d5;
  --gold: #cfb87c; --gold-soft: #f6f1e4; --alert: #b3261e; --ok: #1f6b3a;
  --dash: #000000; --dash-ink: #ffffff; --dash-muted: #a2a4a3; --dash-line: #3a3a3a; --dash-red: #ff5a4f; --dash-amber: #cfb87c;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #000000; --card: #141414; --ink: #ffffff; --muted: #a2a4a3; --line: #333333; --gold-soft: #29231a; --alert: #ff8a80; --ok: #7ed89b; --dash: #0b0b0b; --dash-line: #444; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 6px var(--gold); }
.hidden { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.wrap.wide { max-width: 1120px; }

header.top { background: #000; color: #fff; border-bottom: 4px solid var(--gold); }
header.top .wrap { padding-top: 10px; padding-bottom: 10px; display: grid; gap: 6px; }
.kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
header.top .kicker { color: var(--gold); }
.brand { font-family: var(--font-display); font-weight: 900; font-size: 28px; line-height: 1; text-transform: uppercase; margin: 0; color: #fff; }
.brand span { background: var(--gold); color: #000; padding: 0 .15em; }
.toprow { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; justify-content: space-between; }
.odo { display: flex; gap: 12px; font-family: var(--font-mono); font-size: 12.5px; color: #c8c9c9; flex-wrap: wrap; align-items: center; }
.odo .digits { display: inline-flex; gap: 1px; margin-left: 4px; }
.odo .digits b { background: #1c1c1c; color: #fff; border: 1px solid #565a5c; padding: 0 3px; font-weight: 500; min-width: 1.1em; text-align: center; }
.odo .muted-dark { color: #8c8e8d; }
nav.rail { display: flex; gap: 4px; flex-wrap: wrap; }
nav.rail button { font-family: var(--font-mono); font-size: 12.5px; border: 1.5px solid #565a5c; background: transparent; color: #c8c9c9; padding: 4px 8px; cursor: pointer; border-radius: 0; }
nav.rail button.now { background: var(--gold); color: #000; border-color: var(--gold); }

main { padding: 18px 0 40px; }
section.screen { display: grid; gap: 14px; min-width: 0; }
section.screen > * { min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: clamp(44px, 10vw, 76px); line-height: 1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 32px; line-height: 1.02; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 21px; line-height: 1.1; margin: 0; }
p { margin: 0; }
q { font-style: italic; }
.lede { font-size: 18px; max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: 14.5px; }
.tag { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.card { background: var(--card); border: 2px solid var(--ink); padding: 14px; display: grid; gap: 10px; }
.card.hot { box-shadow: 6px 6px 0 var(--gold); }
textarea, input[type=text], input[inputmode] { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); padding: 9px 11px; border-radius: 0; }
textarea { resize: vertical; min-height: 66px; }
textarea:focus, input:focus { border-color: var(--ink); outline: none; }
label.lab, p.lab { font-weight: 700; display: block; }
.field { display: grid; gap: 5px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.btn { font: inherit; font-weight: 700; cursor: pointer; border: 2px solid var(--ink); background: var(--card); color: var(--ink); padding: 9px 16px; border-radius: 0; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--gold); border-color: var(--gold); color: #000; }
.btn.ignite::before { content: ""; display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: var(--gold); margin-right: .45em; vertical-align: .02em; }
.btn.route { background: var(--gold); border-color: var(--gold); color: #000; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 4px 10px; font-size: 14px; border-width: 1.5px; }
.btn.link { border: 0; background: none; padding: 2px 0; font-weight: 400; text-decoration: underline; color: var(--muted); }
.note { border-left: 4px solid var(--gold); padding: 6px 12px; background: var(--gold-soft); }
.alertnote { border-left: 4px solid var(--alert); padding: 6px 12px; background: var(--gold-soft); }
.alertline { color: var(--alert); }
.okline { color: var(--ok); }
.example { font-size: 15px; border-left: 4px solid var(--line); padding: 4px 12px; }
.chip { display: inline-block; justify-self: start; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; background: var(--gold); color: #000; }
ol.plain, ul.plain { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.status { font-family: var(--font-mono); font-size: 15px; }
.dots::after { content: "..."; }
details.older summary { cursor: pointer; font-family: var(--font-mono); font-size: 13px; }
details.older ul { margin-top: 8px; }

/* the canvas: standard nine-block layout */
.canvas { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px;
  grid-template-areas: "kp kp ka ka vp vp cr cr cs cs" "kp kp kr kr vp vp ch ch cs cs" "co co co co co rs rs rs rs rs"; }
.cell { grid-area: var(--a); border: 1.5px solid var(--line); background: var(--card); min-width: 0; position: relative; }
.thumb .cell { font: inherit; color: var(--ink); text-align: left; cursor: pointer; padding: 5px 5px 6px; min-height: 40px; border-style: dashed; border-radius: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 2px; }
.thumb .cell .s { font-family: var(--font-mono); font-size: 10.5px; line-height: 1.15; hyphens: auto; }
.thumb .cell .mk { font-size: 12px; line-height: 1; color: var(--muted); }
.thumb .cell.filled { border-style: solid; border-color: var(--ink); background: var(--gold-soft); }
.thumb .cell.filled .mk { color: var(--ink); }
.thumb .cell.ch { box-shadow: inset 0 -4px 0 var(--gold); }
.thumb .cell.cur { background: var(--gold); border-color: var(--gold); color: #000; border-style: solid; }
.thumb .cell.cur .mk { color: #000; }
.full .cell { padding: 7px 8px 9px; min-height: 92px; display: grid; align-content: start; gap: 3px; }
.full .cell .n { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 16px; line-height: 1.05; }
.full .cell .nm { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.full .cell .t { font-size: 14px; white-space: pre-wrap; }
.full .cell .t.empty { color: var(--muted); font-style: italic; }
@media (max-width: 620px) {
  .full.canvas { grid-template-columns: minmax(0, 1fr); grid-template-areas: "cs" "vp" "ch" "cr" "rs" "kr" "ka" "kp" "co"; }
  .full .cell { min-height: 0; }
}
@media (min-width: 900px) { .thumb .cell { min-height: 54px; } .thumb .cell .s { font-size: 12px; } }
.blockhead { display: grid; gap: 2px; }
.blockhead .nm { font-family: var(--font-mono); font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

/* numbers */
.money { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 560px) { .money { grid-template-columns: minmax(0, 1fr); } }
.dollar { position: relative; }
.dollar span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.dollar input { padding-left: 24px; }

/* the dashboard */
.dashpanel { background: var(--dash); color: var(--dash-ink); border: 2px solid var(--dash); padding: 16px; display: grid; gap: 14px; border-bottom: 4px solid var(--gold); }
.dashpanel h2 { color: var(--dash-ink); font-size: 36px; }
.dashpanel .hl { display: grid; gap: 6px; }
.dashpanel .need { color: var(--dash-amber); font-weight: 700; }
.dashpanel .standing { color: var(--dash-muted); font-size: 14.5px; max-width: 60ch; }
.gauges { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.gauge { border: 1.5px solid var(--dash-line); padding: 8px 8px 10px; display: grid; gap: 2px; align-content: start; }
.gauge .gt { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dash-muted); }
.gsvg { width: 100%; max-width: 280px; height: auto; display: block; margin: 0 auto; }
.gsvg .zone { fill: none; stroke-width: 12; }
.gsvg .zone.ok { stroke: #6f7172; }
.gsvg .zone.amber { stroke: var(--dash-amber); }
.gsvg .zone.red { stroke: var(--dash-red); }
.gsvg .tick { stroke: var(--dash-ink); stroke-width: 2; }
.gsvg .tl { fill: var(--dash-muted); font-family: var(--font-mono); font-size: 15px; }
.gsvg .q { fill: var(--dash-muted); font-family: var(--font-display); font-weight: 900; font-size: 34px; }
.gsvg .needle line { stroke: var(--dash-ink); stroke-width: 3.5; stroke-linecap: round; }
.gsvg .needle circle { fill: var(--gold); }
.gsvg .needle { transform-origin: 100px 96px; transform: rotate(var(--to)); transition: transform .9s cubic-bezier(.3, 1.4, .5, 1); }
.gsvg .needle.none line { opacity: 0; }
.gread { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
.gsub { font-family: var(--font-mono); font-size: 12px; color: var(--dash-muted); }
@media (max-width: 420px) { .gread { font-size: 13.5px; } .dashpanel { padding: 12px; } }

.lights { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 700px) { .lights { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.light { font: inherit; color: var(--dash-ink); background: #161616; border: 1.5px solid var(--dash-line); padding: 8px 8px 9px; text-align: left; cursor: pointer; display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 8px; row-gap: 1px; align-items: center; border-radius: 0; }
.light:disabled { cursor: default; }
.light .lamp { grid-row: span 2; width: 30px; height: 30px; }
.light .ll { font-size: 13.5px; line-height: 1.2; font-weight: 700; }
.light .lw { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dash-muted); }
.light.shaky .lw { color: var(--dash-amber); }
.light.breaks { border-color: var(--dash-red); }
.light.breaks .lw { color: var(--dash-red); }
.light.open { outline: 2px solid var(--gold); outline-offset: -2px; }
.light.watch { box-shadow: inset 4px 0 0 var(--gold); }
.lamp .lc { fill: none; stroke: #565a5c; stroke-width: 2; }
.lamp.shaky .lc { fill: var(--dash-amber); stroke: var(--dash-amber); }
.lamp.breaks .lc { fill: var(--dash-red); stroke: var(--dash-red); }
.lamp.cant_tell .lc { stroke-dasharray: 3 3; }
.lamp .lg { font-family: var(--font-display); font-weight: 900; font-size: 18px; fill: #000; }
.lamp.cant_tell .lg { fill: var(--dash-muted); }
.lamp.holds .lc { stroke: #6f7172; }
.minilights .lamp { width: 22px; height: 22px; }
.minilights { display: flex; gap: 4px; }
.tapnote { color: var(--dash-muted); }
.detail { border: 1.5px solid var(--dash-line); background: #161616; padding: 10px 12px; display: grid; gap: 6px; }
.detail .lamp { width: 22px; height: 22px; }
.detail .muted { color: var(--dash-muted); }
.detail .tag { color: var(--dash-amber); }
.detail .btn { justify-self: start; background: transparent; color: var(--dash-ink); border-color: var(--dash-ink); }
.card .lamp { width: 22px; height: 22px; }
.card .lamp .lc { stroke: var(--muted); }
.card .lamp.shaky .lc { fill: var(--gold); stroke: var(--gold); }
.card .lamp.breaks .lc { fill: var(--alert); stroke: var(--alert); }
.card .lamp.breaks .lg { fill: #fff; }
.card .lamp.cant_tell .lg { fill: var(--muted); }
.assume li { line-height: 1.35; }

/* ignition: every light comes on, then settles */
.igniting .light .lamp .lc { fill: var(--dash-amber); stroke: var(--dash-amber); animation: blink 1.1s infinite; animation-delay: calc(var(--i) * 90ms); }
.igniting .light .lamp .lg { fill: #000; }
.igniting .needle line { opacity: 1 !important; }
.igniting .needle { animation: sweep 1.4s ease-in-out infinite alternate; }
.igniting .gsvg .q { display: none; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes sweep { from { transform: rotate(-90deg); } to { transform: rotate(90deg); } }
@media (prefers-reduced-motion: reduce) {
  .igniting .light .lamp .lc, .igniting .needle { animation: none; }
  .igniting .needle { transform: rotate(0deg); }
  .gsvg .needle { transition: none; }
}

/* road test */
.survive { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 30px; line-height: 1; }
.survive span { background: var(--gold); color: #000; padding: 2px 8px; display: inline-block; }
.ecard { border: 2px solid var(--ink); background: var(--card); padding: 14px; display: grid; gap: 8px; }
.ecard.bad { box-shadow: 6px 6px 0 var(--alert); }
.ecard.ok { box-shadow: 6px 6px 0 var(--gold); }
.ecard .t { font-size: 19px; font-weight: 700; line-height: 1.3; }
.ecard .verdict { font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; font-weight: 500; }
.ecard.bad .verdict { color: var(--alert); }
.ecard .minilights { background: #000; padding: 5px; justify-self: start; }
.minilights .lamp .lc { stroke: #6f7172; }

footer.foot { border-top: 1.5px solid var(--line); padding: 14px 0 30px; }
footer.foot .wrap { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #000; color: #fff; border: 2px solid var(--gold); padding: 8px 14px; z-index: 60; font-size: 15px; max-width: calc(100% - 32px); }
@media (max-width: 480px) { nav.rail { gap: 3px; } nav.rail button { font-size: 11.5px; padding: 4px 5px; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap wide">
    <div class="toprow">
      <div class="kicker" id="kicker"></div>
      <div class="odo" id="odo" aria-label="Odometer"></div>
    </div>
    <p class="brand" id="brand"></p>
    <nav class="rail" id="rail" aria-label="Screens"></nav>
  </div>
</header>
<main><div class="wrap wide" id="main"></div></main>
<footer class="foot">
  <div class="wrap wide">
    <span id="foot-note"></span>
    <span class="row"><a class="small" id="foot-class" target="_blank" rel="noopener"></a><button class="btn link" id="foot-forget" type="button"></button><button class="btn link" id="foot-reset" type="button"></button></span>
  </div>
</footer>
<div id="toast" class="hidden" role="status"></div>
<script src="config.js?v=1"></script>
<script src="content.js?v=1"></script>
<script src="engine.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
